# Локальный запуск всего приложения одной командой:  docker compose up --build
#   Магазин:           http://localhost:8080
#   GraphQL (GraphiQL): http://localhost:3000/graphql
name: marketplace

services:
  db:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-shop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shop_pass}
      POSTGRES_DB: ${DB_NAME:-shop}
    volumes:
      # PostgreSQL 18+: данные лежат в подпапке версии, поэтому монтируем /var/lib/postgresql (а не .../data)
      - pgdata:/var/lib/postgresql
    ports:
      # Только для вас (127.0.0.1): чтобы подключиться из WebStorm / DBeaver. Если порт занят — поменяйте DB_PORT_HOST в .env
      - "127.0.0.1:${DB_PORT_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development # development: включён GraphiQL и подробные ошибки
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-shop}
      DB_PASSWORD: ${DB_PASSWORD:-shop_pass}
      DB_NAME: ${DB_NAME:-shop}
      JWT_SECRET: ${JWT_SECRET:-change-me-dev-secret-change-me-dev-secret}
      SEED_ON_START: "true" # заполнить пустую БД тестовыми данными
      TRUST_PROXY_HOPS: "1" # перед бэкендом стоит nginx из сервиса frontend
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
    ports:
      - "127.0.0.1:3000:3000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SHOW_DEMO_LOGIN: "true"
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:8080"

volumes:
  pgdata:
